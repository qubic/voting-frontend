name: 🚀 Deploy

on:
    # Only `push` — a merged PR already produces a push to the target branch, so
    # merges still deploy exactly once. Closing a PR *without* merging changes no
    # ref, so it produces no push and (correctly) does not deploy.
    #
    # `main` is intentionally NOT here: production is deployed by
    # release-please.yml only when a stable release is cut, so an intermediate
    # (e.g. rc) version can never be shipped to prod. This workflow deploys the
    # non-production environments only.
    push:
        branches:
            - dev
            - staging

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Do not cancel an in-progress deploy; let it finish to avoid partial uploads.
    cancel-in-progress: false

# Secure default: no permissions unless a job opts in below.
permissions: {}

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        permissions:
            contents: read # just checkout + build; no pushes here
        steps:
            - name: 🛎️ Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false # this job only builds, never pushes

            - name: ⚙️ Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: 📦 Install dependencies
              run: bun install --frozen-lockfile

            - name: 🏗️ Build app
              env:
                  VITE_QUBIC_RPC_URL: ${{ vars.QUBIC_RPC_URL }}
                  VITE_WALLET_CONNECT_PROJECT_ID: ${{ vars.WALLET_CONNECT_PROJECT_ID }}
                  VITE_QUBIC_CHAIN_ID: qubic:mainnet
                  VITE_APP_TITLE: Qubic Voting
                  VITE_APP_DESCRIPTION: Community governance voting system
                  VITE_APP_URL: https://community.voting.qubic.org
              # build:with-data refreshes public/assets.json + public/polls.json from
              # the RPC before building, so the cached data ships fresh every deploy.
              run: bun run build:with-data

            - name: 📦 Upload build artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: dist
                  path: dist/
                  include-hidden-files: true # keep dist/.htaccess (SPA fallback)
                  retention-days: 1

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: build
        # Each branch deploys through its own (ungated) environment.
        environment:
            name: ${{ github.ref_name }}
        steps:
            - name: 📥 Download build artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: dist
                  path: dist/

            - name: 📤 Deploy to the corresponding environment
              uses: SamKirkland/FTP-Deploy-Action@cfcb39fa3cdf2ff98ac1a7fbfa539d20526d474d # 4.3.3
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: |
                      ${{
                        github.ref == 'refs/heads/staging' && secrets.FTP_USERNAME_STAGING ||
                        secrets.FTP_USERNAME_DEV
                      }}
                  password: |
                      ${{
                        github.ref == 'refs/heads/staging' && secrets.FTP_PASSWORD_STAGING ||
                        secrets.FTP_PASSWORD_DEV
                      }}
                  local-dir: dist/
                  protocol: ftps
